name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://localhost:5173 > /dev/null; then
              echo "Application is ready!"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application did not become ready."
          docker compose logs
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multistage
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/node-auth-app:frontend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/node-auth-app:backend

      - name: Stop full stack
        if: always()
        run: docker compose down -v
```
